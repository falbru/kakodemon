version: "2.1"

jobs:
  build-format-lint:
    docker:
      - image: ubuntu:26.04
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y git ca-certificates just wget cmake build-essential libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libfreetype-dev libfontconfig-dev clang-format clang-tidy

      - run:
          name: Initialize submodules
          command: git submodule update --init --recursive

      - run:
          name: Install Kakoune v2026.04.12
          command: |
            wget https://github.com/mawww/kakoune/releases/download/v2026.04.12/kakoune-v2026.04.12-linux.tar.bz2
            tar -xf ./kakoune-v2026.04.12-linux.tar.bz2
            cp ./kakoune-v2026.04.12-linux/bin/kak /usr/local/bin/
            cp -r ./kakoune-v2026.04.12-linux/share/* /usr/local/share/

      - run:
          name: Copy Kakoune configuration
          command: |
            mkdir -p ~/.config/kak/autoload
            cp -r rc/* ~/.config/kak/autoload/

      - run:
          name: Configure CMake
          command: just configure-rel

      - run:
          name: Build kakodemon
          command: just build-rel

      - run:
          name: Run tests
          command: just test-all-rel

      - run:
          name: Run format check
          command: just format-check

workflows:
  ci:
    jobs:
      - build-format-lint
